name: ci-release

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up R (only for the org.Hs.eg.db symbol lookup)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        shell: bash
        run: |
          set -euo pipefail
          # R is no longer needed to render plots -- that is native Rust now.
          # It is still used to provide org.Hs.eg.db, whose sqlite backs the
          # local symbol -> Ensembl lookup exercised by the gene-mode e2e test.
          Rscript -e 'install.packages("BiocManager", repos = "https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install("org.Hs.eg.db", ask = FALSE, update = FALSE)'
          Rscript -e 'stopifnot(requireNamespace("org.Hs.eg.db", quietly = TRUE))'
          # `tracs` only probes a few hardcoded R library paths, but setup-r
          # installs into a versioned prefix, so point it at the real sqlite.
          ORGDB="$(Rscript -e 'cat(system.file("extdata", "org.Hs.eg.sqlite", package = "org.Hs.eg.db"))')"
          test -f "$ORGDB"
          echo "TRACKTOOLS_ORGDB_SQLITE=$ORGDB" >> "$GITHUB_ENV"
          echo "using orgdb sqlite: $ORGDB"

      - name: Set up micromamba (bwtool)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tracktools-bwtool
          create-args: >-
            -c pwwang -c bioconda/label/cf201901 -c conda-forge/label/cf201901
            bwtool htslib openssl=1.0.2h
          cache-environment: true

      - name: Download GEO test data (GSE199964_RAW.tar)
        shell: bash
        run: |
          set -euo pipefail
          SERIES="GSE199964"
          GROUP="${SERIES:0:${#SERIES}-3}nnn"
          URL="https://ftp.ncbi.nlm.nih.gov/geo/series/${GROUP}/${SERIES}/suppl/${SERIES}_RAW.tar"
          mkdir -p localdata/data
          mkdir -p "localdata/data/${SERIES}_RAW"
          curl -L --retry 5 --retry-delay 2 -o "/tmp/${SERIES}_RAW.tar" "$URL"
          tar -xf "/tmp/${SERIES}_RAW.tar" -C "localdata/data/${SERIES}_RAW"
          # Handle nested directory layouts.
          if [[ -d "localdata/data/${SERIES}_RAW/${SERIES}_RAW" ]]; then
            mv "localdata/data/${SERIES}_RAW/${SERIES}_RAW"/* "localdata/data/${SERIES}_RAW"/
            rmdir "localdata/data/${SERIES}_RAW/${SERIES}_RAW"
          fi
          # Some GEO raw bundles may ship gz-compressed bigWigs.
          shopt -s nullglob
          for f in "localdata/data/${SERIES}_RAW"/*.bigWig.gz "localdata/data/${SERIES}_RAW"/*.bw.gz; do
            gunzip -f "$f"
          done
          ls -la "localdata/data/${SERIES}_RAW" | head

      - name: Download full hg19 GTF (for gene-mode end-to-end test)
        shell: bash
        run: |
          set -euo pipefail
          # The end-to-end plot test resolves genes against a full annotation,
          # the same way real usage does, instead of the trimmed testdata/ fixture.
          URL="https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/genes/hg19.ensGene.gtf.gz"
          curl -L --retry 5 --retry-delay 2 -o /tmp/hg19.ensGene.gtf.gz "$URL"
          gunzip -f /tmp/hg19.ensGene.gtf.gz
          mv /tmp/hg19.ensGene.gtf localdata/data/hg19.ensGene.gtf
          ls -la localdata/data/hg19.ensGene.gtf

      - name: Run tests (incl. bwtool alignment + plot end-to-end)
        env:
          TRACKTOOLS_TEST_BWTOOL_ENV: tracktools-bwtool
          TRACKTOOLS_GENE_LOOKUP: online
          TRACKTOOLS_TEST_ENABLE_GENE: "1"
          TRACKTOOLS_TEST_KEEP_WORKDIR: "1"
          XDG_CACHE_HOME: /tmp/tracktools-xdg-cache
        run: cargo test --locked

      - name: Upload end-to-end plot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plot-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/tracs_e2e_*/**

  release:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Compute date tag (UTC)
        id: tag
        shell: bash
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Force-update date tag to this commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Package binary
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/release/tracs.exe"
            ext="exe"
          else
            bin="target/release/tracs"
            ext="bin"
          fi
          test -f "$bin"
          out="dist/tracs-${{ runner.os }}-${{ steps.tag.outputs.tag }}-${short_sha}-${GITHUB_RUN_NUMBER}.${ext}"
          cp "$bin" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Release asset (tag = date)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pkg.outputs.file }}
