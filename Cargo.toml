[package]
name = "tracs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bigtools = { version = "0.5.6", default-features = false, features = ["read"] }
# Grammar-of-graphics engine for the native track renderer. `default-features` is
# off to drop the optional polars/png/wgpu/geo backends; the track renderer feeds
# plain column vectors and only needs SVG output.
charton = { version = "0.6", default-features = false }
clap = { version = "4", features = ["derive"] }
mysql = { version = "27.0.0", default-features = true, features = ["minimal"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
# SVG -> PDF. Used directly (rather than through charton's `pdf` feature) so the
# font database can carry a bundled fallback; see `src/plot/fonts.rs`.
svg2pdf = "0.13"
