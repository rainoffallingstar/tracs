[package]
name = "tracktools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bigtools = { version = "0.5.6", default-features = false, features = ["read"] }
clap = { version = "4", features = ["derive"] }
mysql = { version = "27.0.0", default-features = true, features = ["minimal"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[patch.crates-io]
derive_utils = { path = "vendor/derive_utils" }
io-enum = { path = "vendor/io-enum" }
